spring.application.name=ms-asignaciones
server.port=8083

# --- Base de datos MySQL ---
# La base se crea sola la primera vez gracias a createDatabaseIfNotExist=true
spring.datasource.url=jdbc:mysql://localhost:3306/mpaz_asignaciones?createDatabaseIfNotExist=true&serverTimezone=America/Santiago
# Usuario y clave por defecto de XAMPP/Laragon (root sin clave). Cámbialos si tu MySQL usa otros.
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:}

# --- JPA / Hibernate ---
# update: crea y actualiza las tablas a partir de las entidades, sin borrar los datos
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
